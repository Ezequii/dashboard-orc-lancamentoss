name: Quality Gate e Atualização
on:
  push:
    branches: [main]
    paths: ['atualizar_dados/CONTROLE_DE_REQUISICOES_2026.xlsx','scripts/**','src/**','tests/**','package*.json']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: dashboard-production-main, cancel-in-progress: true}
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: pip install openpyxl==3.1.5
      - name: Processar e validar dados
        run: python scripts/atualizar_dados.py
      - run: npm ci
      - name: Testes automatizados
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Commit rastreável
        run: |
          if git diff --quiet -- public/data validation-report.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data validation-report.json
          git commit -m 'Atualiza base certificada v6.0 [skip ci]'
          git push
