name: Dados, Relatórios e Quality Gate
on:
  push:
    branches: [main]
    paths: ['atualizar_dados/CONTROLE_DE_REQUISICOES_2026.xlsx','scripts/**','src/**','tests/**','package*.json']
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: dashboard-relatorios-main, cancel-in-progress: true}
jobs:
  processar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: pip install openpyxl==3.1.5
      - run: python scripts/atualizar_dados.py
      - run: python scripts/gerar_resumo_executivo.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit dos dados e resumo
        run: |
          if git diff --quiet -- public/data; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          git commit -m 'Atualiza dados e relatório executivo v6.2 [skip ci]'
          git push
